<!doctype html>
<html lang="ru" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nivel · Лазерная отметка</title>
<meta name="description" content="Концепт 3D-анимации логотипа Nivel: ротационный лазер даёт черту уровня, отвес находит её остриём, слово встаёт на ту же черту.">
<style>
:root{--bg:#F1EFEA;--ink:#1D1D1B;--ink-2:#5E574D;--line:rgba(29,29,27,.2);--chip:rgba(241,239,234,.88);--acc:#D9501A;--laser:#E0301A}
html[data-theme="night"]{--bg:#121110;--ink:#F1EFEA;--ink-2:#A39C90;--line:#3B3631;--chip:rgba(18,17,16,.84);--acc:#F06A30;--laser:#FF3F1F}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
html.warming #stage{visibility:hidden}
#flat{position:fixed;inset:0;display:none;background:var(--bg)}
#flat svg{position:absolute;display:block;overflow:visible}
html.is-flat #flat{display:block}
html.is-flat #stage{display:none}
/* loader: SVG + CSS, frontal, the same rocking on the tip */
#flat .ldr{left:50%;top:50%;width:min(30vw,168px);height:auto;transform:translate(-50%,-50%)}
.ldr .rock{transform-box:view-box;transform-origin:0 0;animation:nv-rock var(--ldur,1.4s) linear infinite}
.ldr .ray{animation:nv-ray var(--ldur,1.4s) linear infinite}
html.ldr-frozen .ldr .rock,html.ldr-frozen .ldr .ray{animation-play-state:paused}
#panel{position:fixed;left:16px;bottom:16px;right:16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  font:500 12px/1 "IBM Plex Mono",ui-monospace,Consolas,monospace;letter-spacing:.02em;pointer-events:none}
#panel .grp{display:flex;gap:0;pointer-events:auto}
#panel button{font:inherit;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:0;
  padding:8px 10px;cursor:pointer;margin-left:-1px}
#panel button:disabled{opacity:.4;cursor:default}
#panel .grp button:first-child{border-radius:2px 0 0 2px;margin-left:0}
#panel .grp button:last-child{border-radius:0 2px 2px 0}
#panel .grp button:only-child{border-radius:2px}
#panel button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#panel button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#panel .t{pointer-events:none;color:var(--ink-2);padding:0 4px;min-width:5.5em}
html.no-ui #panel{display:none}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
}}
</script>
</head>
<body>
<div id="stage" aria-hidden="true"></div>
<div id="flat" role="img" aria-label="Nivel"></div>
<nav id="panel" aria-label="Управление анимацией">
  <div class="grp"><button type="button" data-act="replay">Повторить</button></div>
  <div class="grp" role="group" aria-label="Время суток">
    <button type="button" data-theme="day">День</button><button type="button" data-theme="night">Ночь</button>
  </div>
  <div class="grp" role="group" aria-label="Режим">
    <button type="button" data-mode="intro">Заставка</button><button type="button" data-mode="loop">Повтор</button><button type="button" data-mode="loader">Загрузка</button><button type="button" data-mode="static">Статично</button>
  </div>
  <div class="grp" role="group" aria-label="Скорость">
    <button type="button" data-speed="0.5">0.5×</button><button type="button" data-speed="1">1×</button>
  </div>
  <span class="t" id="clock">0.00 с</span>
</nav>

const BRAND = {
  day:   {fg:'#1D1D1B', acc:'#D9501A', bg:'#F1EFEA', laser:'#E0301A'},
  night: {fg:'#F1EFEA', acc:'#F06A30', bg:'#121110', laser:'#FF3F1F'}
};
const MARK_G = 'translate(-6.25 -74.97) scale(1.5619)';
function markPaths(c){ const m = MARK_D; return `<path fill="${c.fg}" d="${m[0]}"/><path fill="${c.acc}" d="${m[1]}"/><path fill="${c.fg}" d="${m[2]}"/><path fill="${c.fg}" d="${m[3]}"/>`; }
/* the lockup exactly as in nivel-1-lockup.svg (used by SVGLoader) */
function lockupSVG(theme){
  const c = BRAND[theme];
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4.0 -77.5 348.6 83.0"><g transform="${MARK_G}">${markPaths(c)}</g><g transform="translate(111.56 0)"><path fill="${c.fg}" d="${WORD_D}"/><path fill="${c.acc}" d="${DOT_D}"/></g></svg>`;
}
/* flat final frame: viewBox = the world box of the lockup (x 0…332.61, y −1.5…73.5) */
function flatSVG(theme){
  const c = BRAND[theme];
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -73.5 332.61 75" preserveAspectRatio="none" aria-hidden="true"><g transform="${MARK_G}">${markPaths(c)}</g><g transform="translate(111.56 0)"><path fill="${c.fg}" d="${WORD_D}"/><path fill="${c.acc}" d="${DOT_D}"/></g></svg>`;

/* loader: the mark only, frontal; the tip of the triangle is the origin, so the rocking group turns about (0,0) */
function loaderSVG(theme){
  const c = BRAND[theme], m = MARK_D;
  return `<svg class="ldr" xmlns="http://www.w3.org/2000/svg" viewBox="-44 -47 112 68" aria-hidden="true">
<g transform="translate(-31.24 12.49)"><g transform="${MARK_G}"><path fill="${c.fg}" d="${m[3]}"/></g></g>
<circle class="ray" cx="0" cy="-0.9" r="1.8" fill="${c.laser}"/>
<g class="rock"><g transform="translate(-31.24 12.49)"><g transform="${MARK_G}"><path fill="${c.fg}" d="${m[0]}"/><path fill="${c.acc}" d="${m[1]}"/><path fill="${c.fg}" d="${m[2]}"/></g></g></g>

}

/* ---------------- params ---------------- */
const Q = new URLSearchParams(location.search);
const state = {
  theme: Q.get('theme') === 'night' || Q.get('theme') === 'day' ? Q.get('theme') : 'night',
  mode: ['intro','loop','loader','static'].includes(Q.get('mode')) ? Q.get('mode') : 'intro',
  speed: Q.get('speed') === '0.5' ? 0.5 : 1,
  frozen: Q.has('t') ? Math.max(0, parseFloat(Q.get('t')) || 0) : null,

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduce && state.frozen === null) state.mode = 'static';
const root = document.documentElement;
if (Q.get('ui') === '0' || state.frozen !== null) root.classList.add('no-ui');
const clock = document.getElementById('clock');
function markReady(){ requestAnimationFrame(() => { window.__ready = true; document.body.dataset.ready = '1'; }); }

/* ---------------- shared numbers ---------------- */
const clamp = (x,a=0,b=1) => Math.min(b, Math.max(a, x));
const seg = (t,a,b) => clamp((t-a)/(b-a));
const lerp = (a,b,u) => a + (b-a)*u;
const eOutCubic = u => 1 - Math.pow(1-u, 3);
const eInOutSine = u => -(Math.cos(Math.PI*u) - 1)/2;
const eInQuad = u => u*u;
/* impact: starts at 0 moving toward −1, decays */
const bounce = (tau,k,w) => tau <= 0 ? 0 : -Math.exp(-k*tau)*Math.sin(w*tau);
/* critically damped approach from −1 to 0, no overshoot */
const crit = (tau,w) => tau <= 0 ? -1 : -(1 + w*tau)*Math.exp(-w*tau);
const DEG = Math.PI/180;

const MK = v => [-6.25 + 1.5619*v[0], 74.97 - 1.5619*v[1]];
const TIP = MK([24,40]);            // (31.24, 12.49) — tip on the top face of the level bar
const LEVEL = TIP[1];               // the level line of the mark = top face of the bar
const SHELF_TOP = MK([0,16])[1];    // 49.97
const SHELF_R = MK([60,0])[0];      // 87.46
const SHELF_RETRACT = MK([40,0])[0] - SHELF_R; // shelf starts flush with the triangle
const DOT_C = [111.56 + (64.53+87.42+75.98)/3, (73.25+73.25+61.8)/3];
const BOX = {x0:0, x1:332.61, y0:-1.5, y1:73.5};
const CENTER = [(BOX.x0+BOX.x1)/2, (BOX.y0+BOX.y1)/2];
const STAND = 1.6, DEPTH = 10, BEV = 0.9;
const ZF = STAND + DEPTH + 2*BEV;
const ZM = STAND + BEV + DEPTH/2;
const VFOV = 24*DEG;
const DUR = {intro: 4.0, loop: 14, loader: 1.4};
/* rotary laser on a wall mount, left of the mark; its plane sits just on the level line */
const DEV = {x:-108, z:15};
const LASER_Y = LEVEL + 0.7;

/* camera framing of the final lockup — shared by WebGL and the flat SVG so the two coincide */
function finalCam(aspect){
  const tv = Math.tan(VFOV/2);
  const D = Math.max(((BOX.y1-BOX.y0)/0.42/2)/tv, ((BOX.x1-BOX.x0)/0.70/2)/(tv*aspect));
  return {T:[CENTER[0], CENTER[1]+1, ZM], yaw:0, pitch:4*DEG, D};
}
function finalRect(w, h){
  const F = finalCam(w/h), s = Math.sin(F.pitch), c = Math.cos(F.pitch), tv = Math.tan(VFOV/2);
  const C = [F.T[0], F.T[1] + F.D*s, F.T[2] + F.D*c];
  const proj = (x,y,z) => { const d = [x-C[0], y-C[1], z-C[2]]; const xc = d[0], yc = d[1]*c - d[2]*s, zc = -d[1]*s - d[2]*c;
    return [w/2 + (xc/zc)/tv*(h/2), h/2 - (yc/zc)/tv*(h/2)]; };
  const z = ZF - BEV, a = proj(BOX.x0, BOX.y1, z), b = proj(BOX.x1, BOX.y0, z);
  return {x:a[0], y:a[1], w:b[0]-a[0], h:b[1]-a[1]};

/* ---------------- flat views (static, loader, no-WebGL) ---------------- */
const flat = document.getElementById('flat');
let flatKey = '';
function placeFlat(){
  const svg = flat.querySelector('svg:not(.ldr)'); if (!svg) return;
  const r = finalRect(innerWidth, innerHeight);
  Object.assign(svg.style, {left:r.x+'px', top:r.y+'px', width:r.w+'px', height:r.h+'px'});
}
function loaderCSS(){
  /* damped rock on the tip after a tap, then 0.3 s of stillness; the laser dot crosses under the mark once */
  const N = 70, A = 5.5, w = 2*Math.PI/0.38, k = 4.6, T = DUR.loader;
  let rock = '', ray = '';
  for (let i=0;i<=N;i++){
    const u = i/N, tau = u*T, th = tau < 1.1 ? A*Math.exp(-k*tau)*Math.sin(w*tau) : 0;

function showFlat(){
  root.classList.add('is-flat');
  const key = state.mode + state.theme;
  if (key !== flatKey){ flat.innerHTML = state.mode === 'loader' ? loaderSVG(state.theme) : flatSVG(state.theme); flatKey = key; }
  root.style.setProperty('--ldur', (DUR.loader/state.speed) + 's');
  if (state.mode === 'loader'){
    const t = state.frozen;
    root.classList.toggle('ldr-frozen', t !== null);
    flat.querySelectorAll('.rock,.ray').forEach(el => { el.style.animationDelay = t !== null ? (-(t % DUR.loader)/state.speed) + 's' : '0s'; });

  } else { placeFlat(); clock.textContent = 'финал'; }
}
function hideFlat(){ root.classList.remove('is-flat'); }

/* ---------------- WebGL availability ---------------- */
function hasWebGL(){
  try { const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); }
  catch(e){ return false; }
}
const GL = hasWebGL();
let api = null, glBoot = null, startToken = 0;
function disableGLButtons(){
  document.querySelectorAll('#panel [data-mode]').forEach(b => { if (b.dataset.mode === 'intro' || b.dataset.mode === 'loop') b.disabled = true; });
  document.querySelector('#panel [data-act="replay"]').disabled = true;
}
function is3D(){ return state.mode === 'intro' || state.mode === 'loop'; }

/* ---------------- start (any mode) ---------------- */
function start(){
  const token = ++startToken;
  if (is3D() && !GL){ state.mode = 'static'; }
  syncUI();
  if (!is3D()){ api && api.stop(); showFlat(); markReady(); return; }
  if (!glBoot) glBoot = bootGL();
  glBoot.then(a => {
    if (token !== startToken) return;
    if (!a){ state.mode = 'static'; disableGLButtons(); syncUI(); showFlat(); markReady(); return; }
    api = a; a.start(token);
  });
}
addEventListener('resize', () => { if (root.classList.contains('is-flat')) placeFlat(); else if (api) api.onResize(); });

/* ---------------- UI ---------------- */
function syncUI(){
  document.querySelectorAll('#panel [data-theme]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.theme === state.theme)));
  document.querySelectorAll('#panel [data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode)));
  document.querySelectorAll('#panel [data-speed]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.speed === state.speed)));
  root.dataset.theme = state.theme;
}
document.getElementById('panel').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.act === 'replay'){ state.frozen = null; state.t = 0; if (!is3D()) state.mode = 'intro'; start(); return; }
  if (b.dataset.theme){ state.theme = b.dataset.theme; state.frozen = null; start(); return; }
  if (b.dataset.mode){ state.mode = b.dataset.mode; state.frozen = null; state.t = 0; start(); return; }
  if (b.dataset.speed){ state.speed = +b.dataset.speed; syncUI(); if (state.mode === 'loader') showFlat(); }
});
if (!GL) disableGLButtons();
start();

/* ================================================================== */
async function bootGL(){
  let THREE, SVGLoader, RoomEnvironment;
  try {
    THREE = await import('three');
    ({ SVGLoader } = await import('three/addons/loaders/SVGLoader.js'));
    ({ RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js'));
  } catch(e) {
    console.warn('three.js unavailable, static SVG shown', e);
    return null;
  }

  const stage = document.getElementById('stage');
  let renderer;
  try { renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'}); }
  catch(e){ console.warn('WebGL context failed', e); return null; }
  const LITE = matchMedia('(pointer: coarse)').matches || (navigator.hardwareConcurrency || 8) <= 4;
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, LITE ? 1.5 : 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NoToneMapping;          // brand colours are matched by albedo and light, not by a curve
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  renderer.localClippingEnabled = true;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(24, 1, 5, 9000);

  /* ---------- camera rig ---------- */

  }

    setBar(() => 1); setShelf(0);

    dot.position.set(DOT_C[0], DOT_C[1], 0); dot.rotation.set(0,0,0);
    letters.forEach(m => { m.position.set(m.userData.pv[0], 0, 0); m.rotation.set(0,0,0); m.visible = true; });
    engraveClip.constant = 1e4; engr.visible = true;
    thread.visible = dotThread.visible = false; spot.visible = false; spotLight.intensity = 0;
    setLaser(0, -1e5, 0, 0);
    aimHead(60*DEG);
    bar.visible = body.visible = dot.visible = true;
    dev.visible = false;   // off-frame in the final framing; hidden so its shadow never reaches the edge
  }

  function poseIntro(t){
    poseFinal();
    /* 1 · the rotary head turns: the dot runs along the wall at x = x_dev + z·tan φ and leaves the level line */
    const phi = lerp(TL.phi0, TL.phi1, seg(t, ...TL.sweep));
    const hx = dotX(phi);
    aimHead(phi);
    dev.visible = t < TL.cam1F[0];
    const lineA = 1 - seg(t, ...TL.laserOff);
    const tipFlash = t >= TL.touch ? Math.exp(-(t - TL.touch)/0.055) : 0;
    if (t < TL.sweep[1]) setLaser(lineA, hx, 1, hx);
    else if (tipFlash > 0.02) setLaser(lineA, 1e5, tipFlash, TIP[0], TH.laser.head*1.25);
    else setLaser(lineA, 1e5, 0, 0);

    /* 2 · the level bar grows out of the line behind the dot */
    setBar(x => {
      const tp = TL.sweep[0] + (TL.sweep[1]-TL.sweep[0])*clamp((Math.atan((x - DEV.x)/DEV.z) - TL.phi0)/(TL.phi1 - TL.phi0));
      return eOutCubic(clamp((t - tp - 0.02)/0.32));
    });

    /* 3 · plumb on its thread: damped swing (T 0.7 s, e^(−2.6t)), lowered, then set onto the line by hand */
    const yDrop = (TL.drop0 - 3)*(1 - eInOutSine(seg(t, ...TL.lower))) + 3*(1 - eInOutSine(seg(t, ...TL.approach)));
    const S = TL.swing;
    let theta = S.a*Math.exp(-S.k*t)*Math.cos(2*Math.PI*t/S.T) * (1 - eInOutSine(seg(t, ...S.off)));
    /* shelf hits its stop → the whole mark rocks a little on its tip */
    theta += 0.9*DEG*bounce(t - TL.shelf[1], 11, 2*Math.PI/0.24);
    body.rotation.z = theta;
    body.position.set(TIP[0] + L*Math.sin(theta)*(t < TL.touch ? 1 : 0), TIP[1] + (t < TL.touch ? L*(1-Math.cos(theta)) : 0) + yDrop, 0);

    const pull = 560*eInQuad(seg(t, ...TL.thread));
    thread.visible = t < TL.thread[1];
    if (thread.visible){
      const h = SHELF_TOP - TIP[1];
      const ax = TIP[0] - h*Math.sin(theta) + L*Math.sin(theta);
      const ay = TIP[1] + yDrop + L*(1-Math.cos(theta)) + h*Math.cos(theta);
      const px = TIP[0], py = TIP[1] + L + yDrop;
      const ext = (L - h + 600)/(L - h);
      setThread(thread, [ax, ay + pull], [ax + (px-ax)*ext, ay + (py-ay)*ext + pull]);
    }

    /* 4 · shelf slides out to its stop, visible knock and recoil */
    const ps = eInQuad(seg(t, ...TL.shelf));
    setShelf(SHELF_RETRACT*(1 - ps) + 2.5*bounce(t - TL.shelf[1], 13, 2*Math.PI/0.18));

    /* 5 · the laser engraves ±0.000 on the shelf */
    const ex = lerp(31 - 18, 31 + 18, seg(t, ...TL.engrave));
    engraveClip.constant = t < TL.engrave[0] ? -1e4 : ex;
    spot.visible = t > TL.engrave[0] && t < TL.engrave[1];
    if (spot.visible){
      const zr = ZM + 3.2*Math.sin(t*95);
      spot.position.set(ex, SHELF_TOP + 0.3, zr);
      spotLight.position.set(ex, SHELF_TOP + 1.2, zr); spotLight.intensity = state.theme === 'night' ? 6 : 0;
    }

    /* 6 · the word rises out of the baseline, letter by letter, critically damped (no overshoot) */
    letters.forEach((m, i) => {
      const st = TL.word + i*TL.wordStep;
      m.position.y = TL.wordH*crit(t - st, TL.wordW);
      m.visible = t > st;
    });

    /* 7 · the i-dot is lowered on a short thread, small damped swing, and stays */
    const yTop = FINAL().T[1] + FINAL().D*Math.tan(VFOV/2)*1.25;
    const drop2 = Math.max(90, yTop - DOT_C[1] + 30);
    const tau2 = t - TL.dot[0];
    const yd2 = drop2*(1 - eOutCubic(seg(t, ...TL.dot)));
    const th2 = 4*DEG*Math.exp(-6*Math.max(0,tau2))*Math.cos(2*Math.PI*Math.max(0,tau2)/0.42) * (1 - seg(t, TL.dot[1]-0.1, TL.dot[1]));
    dot.visible = t > TL.dot[0];
    dot.rotation.set(0, 0, th2);
    dot.position.set(DOT_C[0] + L2*Math.sin(th2), DOT_C[1] + L2*(1-Math.cos(th2)) + yd2, 0);
    dotThread.visible = dot.visible && t < TL.dotThread[1];
    if (dotThread.visible){
      const pull2 = 400*eInQuad(seg(t, ...TL.dotThread));
      const ux = -Math.sin(th2), uy = Math.cos(th2);
      const ax = dot.position.x + (73.25 - DOT_C[1])*ux, ay = dot.position.y + (73.25 - DOT_C[1])*uy;
      setThread(dotThread, [ax, ay + pull2], [ax + ux*900, ay + uy*900 + pull2]);
    }
  }

  function poseLoop(t){
    poseFinal();
    /* once a cycle the rotary laser quietly re-checks the level */
    const lt = t % DUR.loop;
    const phi = lerp(52*DEG, 89.7*DEG, eInOutSine(seg(lt, 6.2, 7.8)));
    aimHead(phi);
    const a = Math.min(seg(lt, 6.2, 6.5), 1 - seg(lt, 8.6, 9.4));
    const on = lt > 6.2 && lt < 7.8;
    setLaser(a*0.85, on ? dotX(phi) : 1e5, on ? 0.9 : 0, dotX(phi));
  }

  function cameraFor(t){
    const F = FINAL();
    if (state.mode === 'intro'){
      const sg = state.theme === 'day' ? 1 : -1;
      const K0 = {T:[-26, 56, ZM], yaw:sg*20*DEG, pitch:9*DEG, D:fitDist(228, 168)};
      const K1 = {T:[44, 27, ZM], yaw:sg*15*DEG, pitch:20*DEG, D:fitDist(128, 98)};
      const mix = (a,b,u) => ({T:lerp3(a.T,b.T,u), yaw:lerp(a.yaw,b.yaw,u), pitch:lerp(a.pitch,b.pitch,u), D:lerpLog(a.D,b.D,u)});
      const C = mix(mix(K0, K1, eInOutSine(seg(t, ...TL.cam01))), F, eInOutSine(seg(t, ...TL.cam1F)));
      rig(C.T, C.yaw, C.pitch, C.D);
      placeKey(0);
    } else {
      const ph = 2*Math.PI*((t % DUR.loop)/DUR.loop);
      rig(F.T, 3.2*DEG*Math.sin(ph), F.pitch + 1.4*DEG*(1 - Math.cos(ph))/2, F.D);
      placeKey(-22*Math.sin(ph));
    }
  }

  function renderAt(t){
    if (state.mode === 'intro') poseIntro(Math.min(t, DUR.intro));
    else poseLoop(t);
    cameraFor(t);
    renderer.render(scene, camera);
    clock.textContent = t.toFixed(2) + ' с';
  }

  /* ---------- sizing ---------- */
  function resize(){
    const w = stage.clientWidth || innerWidth, h = stage.clientHeight || innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w/h; camera.updateProjectionMatrix();
  }

  /* ---------- shader warm-up: compile every program before the clock starts ---------- */
  const warmed = {};
  async function warm(){
    if (warmed[state.theme]) return;
    const saved = [];
    scene.traverse(o => { if (o.isMesh || o.isLight){ saved.push([o, o.visible, o.frustumCulled]); o.visible = true; o.frustumCulled = false; } });
    spotLight.intensity = 1;
    cameraFor(0);
    try { await renderer.compileAsync(scene, camera); } catch(e){ /* older drivers: the warm render below compiles */ }
    renderer.render(scene, camera);
    saved.forEach(([o,v,f]) => { o.visible = v; o.frustumCulled = f; });
    warmed[state.theme] = true;
  }

  let running = false, last = null;
  function tick(ts){
    if (!running) return;
    if (last === null) last = ts;
    const dt = Math.min(0.05, (ts - last)/1000); last = ts;
    state.t += dt*state.speed;
    if (state.mode === 'intro' && state.t >= DUR.intro){ state.t = DUR.intro; renderAt(state.t); running = false; return; }
    renderAt(state.t);
    requestAnimationFrame(tick);
  }
  function play(){ last = null; if (!running){ running = true; requestAnimationFrame(tick); } }
  function stop(){ running = false; }

  async function startGL(token){
    stop();
    applyTheme(); resize();
    root.classList.add('warming');
    await warm();
    if (token !== startToken) return;
    hideFlat();
    root.classList.remove('warming');
    if (state.frozen !== null){ state.t = state.frozen; renderAt(state.t); markReady(); return; }
    if (!state.autoplay && state.mode === 'intro'){ state.t = 0; renderAt(0); markReady(); return; }
    renderAt(state.t); markReady(); play();
  }

  /* for the frame renderer and colour checks */
  const v3 = new THREE.Vector3();
  window.NIVEL = {
    renderAt: (t) => { state.t = t; renderAt(t); }, state,
    project: (x,y,z) => { v3.set(x,y,z).project(camera); return [(v3.x+1)/2*innerWidth, (1-v3.y)/2*innerHeight]; },
    probes: () => ({
      tri: MK([18.5,28]), dot: [DOT_C[0], DOT_C[1]+1], n: [111.56+12.3, 22], l: [111.56+215, 40], bar: MK([46,44]), shelf: MK([46,20]), v: [111.56+117, 5]
    }), ZF
  };

  return { start: startGL, stop, onResize(){ if (!TH) return; resize(); if (!running) renderAt(state.t); } };
}
</script>
</body>
</html>

<!doctype html>
<html lang="ru" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nivel — посадка по допуску</title>
<meta name="description" content="Моушен логотипа Nivel: детали знака и слова садятся в гнёзда фрезерованной плиты.">
<script>
/* Theme and params resolved before first paint (no flash). */
(function(){
  var q=new URLSearchParams(location.search);
  var th=q.get('theme'); if(th!=='day'&&th!=='night') th='night';
  document.documentElement.setAttribute('data-theme',th);
  if(q.get('ui')==='0') document.documentElement.classList.add('no-ui');
})();
</script>
<style>
:root{
  --asphalt:#1D1D1B; --signal:#D9501A; --signal-dark:#F06A30; --paper:#F1EFEA;
  --sans:"Segoe UI", "Fira Sans", Arial, sans-serif;
  --mono:ui-monospace, "IBM Plex Mono", Consolas, monospace;
}
[data-theme="day"]{ --bg:#F1EFEA; --bg-img:none; --ink:#1D1D1B; --ink-2:#5E574D; --line:rgba(29,29,27,.18); --chip:rgba(241,239,234,.9); --on:#1D1D1B; --on-ink:#F1EFEA;
  --mk-ink:#1D1D1B; --mk-acc:#D9501A; }
/* night: same lamp pool as the 3D frame, so a switch to the flat SVG does not jump */
[data-theme="night"]{ --bg:#121110; --bg-img:radial-gradient(circle at 50% 50%, #2C2825 0, #2A2623 35vmin, #25211F 50vmin, #181513 72vmin, #121110 92vmin);
  --ink:#F1EFEA; --ink-2:#A39C90; --line:#3B3631; --chip:rgba(18,17,16,.86); --on:#F1EFEA; --on-ink:#121110;
  --mk-ink:#F1EFEA; --mk-acc:#F06A30; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
body{background-image:var(--bg-img)}
#stage{position:fixed;inset:0}
#c{position:absolute;inset:0;display:block;width:100%;height:100%;opacity:0;transition:opacity .25s linear}
.gl-on #c{opacity:1}
.gl-snap #c{transition:none}
#flat,#loader{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column}
#flat svg,#loader svg{display:block;height:auto}
.show-flat #flat{display:flex}
.show-loader #loader{display:flex}
[data-theme="day"] .v-night,[data-theme="night"] .v-day{display:none!important}

/* "±0.000" — level mark caption shown for a moment when the shelf seats (intro only) */
#lbl{position:absolute;left:0;top:0;font:500 12px/1 var(--mono);letter-spacing:.02em;color:var(--ink-2);
  white-space:nowrap;pointer-events:none;opacity:0;transform-origin:100% 100%;font-variant-numeric:tabular-nums}

/* Loader: inline SVG + CSS. Shelf and triangle tilt around the apex and settle on the level line.
   Keyframes sampled from the same damped curve as the 3D version (A = 5 deg, 1.4 s, rest 0.2 s). */
#loader .ink{fill:var(--mk-ink)} #loader .acc{fill:var(--mk-acc)}
#loader .tilt{transform-box:view-box;transform-origin:24px 40px;animation:nv-rock 1.4s linear infinite}
#loader .cap{margin-top:14px;font:400 12px/1 var(--mono);color:var(--ink-2);letter-spacing:.04em}
#loader:not(.rm) .cap{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
#loader.rm .tilt{animation:none}
@keyframes nv-rock{
  0%{transform:rotate(0deg)} 4%{transform:rotate(-.578deg)} 8%{transform:rotate(-2.087deg)} 12%{transform:rotate(-3.733deg)}
  16%{transform:rotate(-4.776deg)} 20%{transform:rotate(-4.972deg)} 22%{transform:rotate(-5deg)} 26%{transform:rotate(-4.715deg)}
  30%{transform:rotate(-3.991deg)} 34%{transform:rotate(-2.98deg)} 38%{transform:rotate(-1.856deg)} 42%{transform:rotate(-.778deg)}
  46%{transform:rotate(.131deg)} 50%{transform:rotate(.781deg)} 54%{transform:rotate(1.137deg)} 58%{transform:rotate(1.218deg)}
  62%{transform:rotate(1.083deg)} 66%{transform:rotate(.807deg)} 70%{transform:rotate(.474deg)} 74%{transform:rotate(.167deg)}
  78%{transform:rotate(-.032deg)} 82%{transform:rotate(-.067deg)} 86%{transform:rotate(0deg)} 100%{transform:rotate(0deg)}
}

.ui{position:fixed;left:16px;bottom:16px;right:16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  font:500 12px/1 var(--sans);pointer-events:none}
.ui>*{pointer-events:auto}
.no-ui .ui{display:none}
.ui button{font:inherit;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:2px;
  height:30px;padding:0 10px;cursor:pointer;transition:background-color .15s,color .15s,border-color .15s}
.ui button:hover{border-color:var(--ink-2)}
.ui button[aria-pressed="true"]{background:var(--on);color:var(--on-ink);border-color:var(--on)}
.ui .seg{display:flex;flex-wrap:wrap}
.ui .seg button+button{margin-left:-1px}
.ui .tc{font:400 11px/1 var(--mono);color:var(--ink-2);padding:0 6px;font-variant-numeric:tabular-nums;min-width:96px}
.ui button:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
@media (max-width:560px){ .ui .tc{display:none} .ui button{padding:0 7px} }
</style>

<div id="stage">

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
/* =====================================================================
   Nivel logo motion: "fit to tolerance".
   A milled plate with pockets along the lockup contour; each part comes in
   along its own axis, lines up over its pocket and drops in flush.
   Deterministic timeline: every frame is a pure function of t.
   ===================================================================== */
const root = document.documentElement;
const Q = new URLSearchParams(location.search);
const DUR = { intro: 3.3, loop: 12, loader: 1.4 };       // seconds
const MODES = ['intro', 'hero', 'loop', 'loader', 'static'];
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches && Q.get('rm') !== 'ignore';
const T_START = performance.now();
const INTRO_WAIT = 300;                                     // ms of plain background before falling back to the flat SVG

const S = {
  theme: root.getAttribute('data-theme'),
  mode: MODES.includes(Q.get('mode')) ? Q.get('mode') : 'intro',
  tFixed: Q.has('t') ? Math.max(0, parseFloat(Q.get('t')) || 0) : null,
  autoplay: Q.get('autoplay') !== '0',
  speed: Q.get('speed') === '0.5' ? 0.5 : 1,
  webgl: null,          // null = unknown, true/false after the check
  late: false,          // intro waited > INTRO_WAIT and fell back to the flat SVG
};
if (REDUCED && S.mode !== 'loader') S.mode = 'static';

/* seat times (s) — shared with the video/audio script */
const CLICKS = [
  { id: 'line',  t: 0.52 }, { id: 'tri', t: 0.80 }, { id: 'shelf', t: 1.14 },
  { id: 'word',  t: 1.60 }, { id: 'dot', t: 2.12 },
];

/* ---------- flat SVG version (static mode, no WebGL, reduced motion) ---------- */
const flat = document.getElementById('flat');
const loaderEl = document.getElementById('loader');
const tpl = id => document.getElementById(id).innerHTML;
function buildFlat() {
  if (flat.dataset.built) return sizeFlat();
  flat.innerHTML = `<div class="v-day">${tpl('src-lockup')}</div><div class="v-night">${tpl('src-lockup-inverse')}</div>`;
  flat.dataset.built = '1';
  sizeFlat();
}
/* Pixel width uses the same framing rule as the final 3D frame. */
function frameFrac(w) { return w < 700 ? 0.8 : 0.62; }
function sizeFlat() {
  const w = innerWidth, h = innerHeight;
  const px = Math.min(w * frameFrac(w), h * 0.5 * 348.6 / 83.0);
  flat.querySelectorAll('svg').forEach(s => { s.style.width = px + 'px'; });
  const mk = Math.min(w, h) * 0.26 * 64 / 56;                // mark: visible part is 56 of 64 units
  loaderEl.querySelector('svg').style.width = mk + 'px';
}
function setupLoader() {
  const tilt = loaderEl.querySelector('.tilt');
  loaderEl.classList.toggle('rm', REDUCED);
  loaderEl.setAttribute('aria-busy', 'true');
  tilt.style.animationDuration = (DUR.loader / S.speed) + 's';
  if (S.tFixed != null) { tilt.style.animationDelay = (-S.tFixed / S.speed) + 's'; tilt.style.animationPlayState = 'paused'; }
  else { tilt.style.animationDelay = '0s'; tilt.style.animationPlayState = 'running'; }
  // restart the CSS animation
  tilt.style.animationName = 'none'; void tilt.getBoundingClientRect(); tilt.style.animationName = '';
}

/* ---------- control panel ---------- */
const ui = document.getElementById('ui'), tc = document.getElementById('tc');
function syncUI() {
  ui.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === S.mode)));
  ui.querySelectorAll('[data-speed]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.speed === S.speed)));
  const u = new URL(location.href);
  u.searchParams.set('theme', S.theme); u.searchParams.set('mode', S.mode);
  if (S.tFixed == null) u.searchParams.delete('t');
  history.replaceState(null, '', u);
}
let engine = null, booting = null;
ui.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.act === 'replay') { S.tFixed = null; S.late = false; applyMode(true); }
  if (b.dataset.act === 'theme') setTheme(S.theme === 'day' ? 'night' : 'day');
  if (b.dataset.mode) { S.mode = b.dataset.mode; S.tFixed = null; S.late = false; applyMode(true); }
  if (b.dataset.speed) { S.speed = +b.dataset.speed; engine && engine.setSpeed(S.speed); if (S.mode === 'loader') setupLoader(); }
  syncUI();
});
function setTheme(t) { S.theme = t; root.setAttribute('data-theme', t); engine && engine.setTheme(t); }

const is3D = m => m === 'intro' || m === 'hero' || m === 'loop';
function applyMode(user) {
  const m = S.mode;
  root.classList.toggle('show-loader', m === 'loader');
  if (m === 'loader') setupLoader();
  if (!is3D(m) || S.webgl === false) {                        // flat or loader, no WebGL needed
    root.classList.toggle('show-flat', m !== 'loader');
    root.classList.remove('gl-on');
    buildFlat();
    engine && engine.stop();
    tc.textContent = m === 'loader' ? `${DUR.loader.toFixed(2)} с, CSS` : 'статично';
    return;
  }
  buildFlat();
  if (engine) { show3D(m); engine.setMode(m); return; }
  // 3D not ready yet. Loop: show the flat lockup (identical to loop t = 0) until the first 3D frame.
  // Intro: keep the plain background, at most INTRO_WAIT ms, then the flat lockup.
  root.classList.toggle('show-flat', m !== 'intro');
  if (m === 'intro' && S.tFixed == null && S.autoplay) {
    setTimeout(() => { if (!engine && S.mode === 'intro') { S.late = true; root.classList.add('show-flat'); } }, Math.max(0, INTRO_WAIT - (performance.now() - T_START)));
  }
  ensureBoot();
}
function show3D(m) {
  if (m === 'intro' && !S.late) {                              // the intro starts from the empty plate: no flat logo underneath
    root.classList.add('gl-snap'); root.classList.remove('show-flat'); root.classList.add('gl-on');
    requestAnimationFrame(() => root.classList.remove('gl-snap'));
  } else {
    root.classList.add('gl-on');                               // fade in over the flat lockup (same pose)
    setTimeout(() => { if (root.classList.contains('gl-on')) root.classList.remove('show-flat'); }, 320);
  }
}
addEventListener('resize', () => { sizeFlat(); engine && engine.resize(); });
window.NV_LOGO = { ready: false, state: S, clicks: CLICKS, dur: DUR };

/* ---------- 3D boot ---------- */
function hasWebGL() {
  try { const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); }
  catch (e) { return false; }
}
function ensureBoot() {
  if (booting) return booting;
  booting = boot().then(() => {
    window.NV_LOGO.ready = true;
    if (!is3D(S.mode)) return;
    if (S.late) { S.mode = 'hero'; engine.setMode('hero', DUR.intro); show3D('hero'); syncUI(); }  // intro came too late: go straight to the loop
    else { show3D(S.mode); engine.setMode(S.mode); }
  }).catch(err => {
    console.error(err); S.webgl = false; engine = null; applyMode(); window.NV_LOGO.ready = true; window.NV_LOGO.error = String(err);
  });
  return booting;
}

syncUI();
if (is3D(S.mode)) S.webgl = hasWebGL();
applyMode();
if (!is3D(S.mode)) window.NV_LOGO.ready = true;              // static / loader: three.js is never requested
window.NV_LOGO.seekLoader = t => { S.tFixed = t; setupLoader(); };

async function boot() {
  const THREE = await import('three');
  const { SVGLoader } = await import('three/addons/loaders/SVGLoader.js');
  const { RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js');
  const pc = (await import('https://cdn.jsdelivr.net/npm/polygon-clipping@0.15.7/+esm')).default;

  const D2R = Math.PI / 180;
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, k) => a + (b - a) * k;
  const smoother = x => { x = clamp(x); return x * x * x * (x * (x * 6 - 15) + 10); };
  const easeOutCubic = x => 1 - Math.pow(1 - clamp(x), 3);
  const easeInOutSine = x => -(Math.cos(Math.PI * clamp(x)) - 1) / 2;

  /* ---------- renderer ---------- */
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  const lite = matchMedia('(pointer:coarse)').matches || innerWidth < 860;
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, lite ? 1.5 : 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(20, 1, 10, 6000);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  /* ---------- geometry from the SVG ---------- */
  const data = new SVGLoader().parse(tpl('src-lockup'));
  const P = data.paths;                     // 0 shelf, 1 triangle left, 2 triangle right, 3 level line, 4 word, 5 i-dot triangle
  if (P.length !== 6) throw new Error('nivel-1-lockup.svg: expected 6 paths, got ' + P.length);
  const ring = (sp, div = 16) => {
    const pts = sp.getPoints(div).map(p => [p.x, -p.y]);          // Y up
    const a = pts[0], b = pts[pts.length - 1];
    if (Math.hypot(a[0] - b[0], a[1] - b[1]) < 1e-6) pts.pop();
    return pts;
  };
  const area = r => { let s = 0; for (let i = 0; i < r.length; i++) { const a = r[i], b = r[(i + 1) % r.length]; s += a[0] * b[1] - b[0] * a[1]; } return s / 2; };
  const ccw = r => area(r) < 0 ? r.slice().reverse() : r;
  const v2 = ([x, y]) => new THREE.Vector2(x, y);
  const shapeOf = (outer, holes = []) => {
    const s = new THREE.Shape(outer.map(v2));
    holes.forEach(h => s.holes.push(new THREE.Path(h.map(v2))));
    return s;
  };

  const DP = 6, BEV = 1.3;                  // pocket depth = part height; chamfer 1.3 x 45 deg
  // groups: 0 face, 1 accent face/wall, 2 chamfer, 3 wall, 4 accent chamfer
  function Builder() {
    const B = [[], [], [], [], []];
    const A = new THREE.Vector3(), Bv = new THREE.Vector3(), C = new THREE.Vector3(), N = new THREE.Vector3(), T = new THREE.Vector3();
    return {

    } else {
      lamp.position.set(LOCK_C.x - 20, LOCK_C.y + 300, 980);
      lamp.target.position.set(LOCK_C.x - 22, LOCK_C.y - 4, 0);
      lamp.intensity = 2.85 * lampK;
      hemi.intensity = 0.03 + 0.12 * lampK;
      hemi.color.set(0xfff1e4); hemi.groundColor.set(0x2a241f);
    }
  }
  const lampOn = t => t < 0.06 ? 0 : 0.62 + 0.38 * easeOutCubic((t - 0.06) / 0.34);   // switch click, driver ramp

  /* ---------- "±0.000" caption over the shelf (intro only) ---------- */
  const lbl = document.getElementById('lbl');
  const pA = new THREE.Vector3(), pB = new THREE.Vector3();
  function label(t) {
    const a = smoother((t - 1.16) / 0.08) * (1 - smoother((t - 1.50) / 0.12));
    if (a <= 0.001) { lbl.style.opacity = 0; return; }
    const bb = bbx(mShelf); camera.updateMatrixWorld();
    pA.set(bb.max.x, bb.max.y + 3.2, 0).project(camera); pB.set(bb.max.x - 10, bb.max.y + 3.2, 0).project(camera);
    const x = (pA.x + 1) / 2 * W, y = (1 - pA.y) / 2 * H, ppu = Math.abs(pA.x - pB.x) / 2 * W / 10;
    lbl.style.fontSize = (8.6 * ppu).toFixed(2) + 'px';
    lbl.style.transform = `translate(${x}px, ${y}px) translate(-100%, -100%)`;
    lbl.style.opacity = (0.9 * a).toFixed(3);
  }

  /* ---------- frame ---------- */
  let mode = S.mode;
  const CAM_END = 1.95;
  function intro(t) {
    const T = THEME[theme];
    // camera: 16 deg orbit to frontal, mark framing to lockup framing; still from 1.95 s, before the last two hits settle
    const e = smoother(t / CAM_END), e2 = smoother((t - 0.3) / (CAM_END - 0.3));
    const tg = new THREE.Vector3().copy(MARK_C).lerp(LOCK_C, e2); tg.y += lerp(26, 0, e);
    orbit(tg, lerp(lockDist() * 0.62, lockDist(), e2), lerp(-16, 0, e) * D2R, lerp(10, 0, e) * D2R);
    for (const k of Object.keys(AX)) {
      const a = AX[k]; placePart(a, t); glintAt(a.m, t, a.t1, T);
      if (k === 'dot') a.m.visible = t > a.t0 - 0.05;
      const rc = t - a.t1; if (rc >= 0 && rc < 0.12) { const e = Math.exp(-rc / 0.025); rig.position.x += a.recoil[0] * e; rig.position.y += a.recoil[1] * e; }
    }
    for (const k of ['line', 'tri', 'shelf']) guideOpacity(G[k], t, -1, AX[k].t1 - AX[k].drop - 0.16);
    guideOpacity(G.dot, t, AX.dot.t0 - 0.35, AX.dot.t1 - AX.dot.drop - 0.16);
    lights(theme === 'night' ? lampOn(t) : 1, 0);
    label(t);
  }
  /* loop: seated lockup; camera breathes, the day sun drifts. tau = 0 is exactly the final intro pose. */
  function loop(tau, ramp) {
    const p = (tau % DUR.loop) / DUR.loop, w = 2 * Math.PI * p, A = ramp ? smoother(tau / 3) : 1;
    orbit(LOCK_C, lockDist(), A * 2.2 * Math.sin(w) * D2R, A * 1.1 * Math.sin(2 * w) * D2R);
    lights(1, A * 4 * Math.sin(w));
    lbl.style.opacity = 0;
  }
  function renderAt(tRaw) {
    resetParts();
    if (mode === 'intro') intro(Math.min(tRaw, DUR.intro));
    else if (mode === 'hero') { if (tRaw < DUR.intro) intro(tRaw); else loop(tRaw - DUR.intro, true); }
    else loop(tRaw, false);
    renderer.render(scene, camera);
  }

  /* ---------- size ---------- */
  function resize() {
    W = innerWidth; H = innerHeight;
    renderer.setSize(W, H, false); camera.aspect = W / H; camera.updateProjectionMatrix();
    // the i-dot starts above the top edge of the final frame, whatever the aspect (1:1, 9:16, phone)
    AX.dot.dist = Math.max(260, lockDist() * Math.tan(camera.fov * D2R / 2) - (bbx(mDot).min.y - LOCK_C.y) + 40);
    kick();
  }

  /* ---------- clock ----------
     t0 is taken from the first frame that is actually drawn; a stalled frame (> 100 ms) shifts t0 instead of skipping time. */
  let t0 = null, last = 0, tNow = S.tFixed ?? 0, playing = false, raf = 0, dead = false;
  const trace = window.NV_LOGO.trace = [];
  const playable = () => S.tFixed == null && S.autoplay;
  const endOf = () => mode === 'intro' ? DUR.intro : Infinity;
  function tick(now) {
    raf = 0; if (dead) return;
    if (playing) {
      if (t0 == null) t0 = now - tNow * 1000 / S.speed;
      else if (now - last > 100) t0 += (now - last) - 1000 / 60;
      last = now;
      tNow = (now - t0) / 1000 * S.speed;
      if (tNow >= endOf()) { tNow = endOf(); playing = false; }
      if (trace.length < 8) trace.push(+tNow.toFixed(3));                  // first drawn times, for the cold-start check
    }
    renderAt(tNow);
    tc.textContent = mode === 'loop' ? `${(tNow % DUR.loop).toFixed(2)} / ${DUR.loop.toFixed(2)} с`
      : mode === 'hero' ? (tNow < DUR.intro ? `${tNow.toFixed(2)} / ${DUR.intro.toFixed(2)} с` : `повтор ${((tNow - DUR.intro) % DUR.loop).toFixed(2)} с`)
      : `${tNow.toFixed(2)} / ${DUR.intro.toFixed(2)} с`;
    if (playing) raf = requestAnimationFrame(tick);
  }
  function kick() { if (!raf && !dead) raf = requestAnimationFrame(tick); }
  function start(at = 0) { tNow = S.tFixed ?? at; t0 = null; playing = playable(); kick(); }

  canvas.addEventListener('webglcontextlost', e => {          // GPU reset: stop the loop, fall back to the flat SVG
    e.preventDefault(); dead = true; if (raf) cancelAnimationFrame(raf); raf = 0;
    S.webgl = false; engine = null; root.classList.remove('gl-on'); applyMode();
  }, { once: true });

  lightTheme(theme);
  resize();
  // warm-up: compile all programs (incl. shadow depth) and draw once off screen, so the first visible frame is t = 0
  mode = 'intro';
  await renderer.compileAsync(scene, camera);
  renderAt(0);
  await new Promise(r => requestAnimationFrame(r));

  engine = {
    setSpeed(sp) { if (playing && t0 != null) t0 = performance.now() - tNow * 1000 / sp; },
    setTheme(t) { lightTheme(t); renderer.compile(scene, camera); kick(); },
    setMode(m, at = 0) { mode = m; dead = false; start(at); },
    stop() { playing = false; if (raf) cancelAnimationFrame(raf); raf = 0; },
    resize,
  };
  // frame capture: seek(t) renders synchronously
  Object.assign(window.NV_LOGO, {
    seek(t) { playing = false; S.tFixed = t; tNow = t; renderAt(t); tc.textContent = `${t.toFixed(2)} с`; return renderer.info.render; },
    info: () => ({ calls: renderer.info.render.calls, triangles: renderer.info.render.triangles, plateHoles: plateMP.length }),
    // screen-space box of a part in the last drawn frame (for review contact sheets)
    box(name) {
      const m = parts.find(p => p.mesh.name === name).mesh, bb = m.geometry.boundingBox, v = new THREE.Vector3();
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; m.updateMatrixWorld(); camera.updateMatrixWorld();
      for (let i = 0; i < 8; i++) {
        v.set(i & 1 ? bb.max.x : bb.min.x, i & 2 ? bb.max.y : bb.min.y, i & 4 ? bb.max.z : bb.min.z).applyMatrix4(m.matrixWorld).project(camera);
        const x = (v.x + 1) / 2 * W, y = (1 - v.y) / 2 * H; x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
      }
      return [x0, y0, x1, y1];
    },
  });
}
</script>
</body>
</html>

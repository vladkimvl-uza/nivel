<style>
  :root{
    --asphalt:#1D1D1B; --signal:#D9501A; --signal-dark:#F06A30; --paper:#F1EFEA;
    --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
    --bg:#F1EFEA; --ink:#1D1D1B; --ink-2:#5E574D; --line:rgba(29,29,27,.14); --accent:#B4481A;
  }
  [data-theme="night"]{ --bg:#0E0C0B; --ink:#F1EFEA; --ink-2:#A39C90; --line:#2E2A26; --accent:#F06A30; }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
  body{font-family:var(--mono);-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0}
  #c{display:block;width:100%;height:100%;visibility:hidden}
  .gl #c{visibility:visible}
  /* the SVG lockup is the page until WebGL draws its first frame (no CDN, no WebGL, gated devices) */
  .fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
  #fallback svg{width:min(72vw,620px);height:auto}
  .gl #fallback{display:none}
  .static #fallback{display:flex} .static #c{display:none}
  #ldr{display:none} #ldr svg{width:min(72vmin,160px);height:auto;overflow:visible}
  .svgldr #ldr{display:flex} .svgldr #fallback, .svgldr #c{display:none}
  .lg-n{display:none}
  [data-theme="night"] .lg-d{display:none}
  [data-theme="night"] .lg-n{display:block}
  /* SVG loader: same timing as the WebGL loader (1.4 s: lift 0-0.30, hover, seat 0.38-0.72, rest) */
  @keyframes nv-seat{
    0%{transform:translateY(0);animation-timing-function:cubic-bezier(.65,0,.35,1)}
    21.43%{transform:translateY(-4px);animation-timing-function:linear}
    27.14%{transform:translateY(-4px);animation-timing-function:cubic-bezier(.5,0,.08,1)}
    51.43%,100%{transform:translateY(0)}
  }
  #ldr .up{animation:nv-seat 1.4s infinite}
  @media (prefers-reduced-motion:reduce){ #ldr .up{animation:none} }

  #panel{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:max(16px,env(safe-area-inset-bottom));
    display:flex;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 32px);box-sizing:border-box;
    font:400 11px/1 var(--mono);letter-spacing:.02em;color:var(--ink-2);
    border:1px solid var(--line);border-radius:2px;background:var(--bg)}
  #panel[hidden]{display:none}
  #panel .grp{display:flex;border-left:1px solid var(--line)}
  #panel .grp:first-child{border-left:0}
  #panel button{all:unset;cursor:pointer;padding:9px 10px;color:var(--ink-2);white-space:nowrap}
  #panel button:hover{color:var(--ink)}
  #panel button[aria-pressed="true"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
  #panel button:focus-visible{outline:1px solid var(--accent);outline-offset:-3px}
  @media (max-width:560px){ #panel button{padding:9px 7px} }
</style>
<script>
  // before paint: theme for the SVG fallback, and a safety net for capture tools if the module never starts
  (function () {
    var q = new URLSearchParams(location.search), th = q.get('theme');
    if (th !== 'day' && th !== 'night') th = 'night';
    document.documentElement.dataset.theme = th;
    setTimeout(function () { if (!window.__nivelReady) { window.__nivelFallback = 'timeout'; window.__nivelReady = true; } }, 8000);
  })();
</script>

<script type="module">
/* ------------------------------------------------------------------ params */
const NV = window.NV3 || null;
const Q = new URLSearchParams(location.search);
const MODES = ['intro', 'loop', 'loader', 'static'];
const root = document.documentElement, body = document.body;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let theme = root.dataset.theme;
// reduced motion always wins over ?mode= (the site will pass the mode explicitly)
let mode = reduced ? 'static' : (MODES.includes(Q.get('mode')) ? Q.get('mode') : 'intro');
const tFixed = Q.has('t') ? Math.max(0, parseFloat(Q.get('t')) || 0) : null;
const autoplay = tFixed === null && Q.get('autoplay') !== '0';
let speed = 1;
const showUI = tFixed === null && Q.get('ui') !== '0';
const forceSvgLoader = Q.get('loader') === 'svg';

/* ------------------------------------------------------------------ gate (NV.gate from the design system) */
function softGate() {
  if (Q.get('gate') === '0') return '';
  const c = navigator.connection;
  if (c && (c.saveData || /(^|-)2g$/.test(c.effectiveType || ''))) return 'save-data';
  if (navigator.deviceMemory && navigator.deviceMemory < 4) return 'device-memory';
  if (navigator.hardwareConcurrency && navigator.hardwareConcurrency < 4) return 'cpu';
  return '';
}
let gateWhy = NV ? softGate() : 'no-three';
if (!gateWhy && mode === 'static' && !showUI) gateWhy = 'static'; // production static: never create a WebGL context
let renderer = null;
const canvas = document.getElementById('c');
if (!gateWhy) {
  try {
    renderer = new NV.THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    const g = renderer.getContext(), ext = g.getExtension('WEBGL_debug_renderer_info');
    const name = ext ? String(g.getParameter(ext.UNMASKED_RENDERER_WEBGL)) : '';
    if (Q.get('gate') !== '0' && /swiftshader|llvmpipe|softpipe|software|basic render/i.test(name)) { gateWhy = 'software-gl'; renderer.dispose(); renderer = null; }
  } catch (e) { gateWhy = 'no-webgl'; renderer = null; }
}
const glOK = !!renderer;

/* --------------------------------------------------------------- DOM / UI */
const panel = document.getElementById('panel');
panel.hidden = !showUI;
const svgLoaderOn = () => mode === 'loader' && (!glOK || forceSvgLoader || Math.min(innerWidth, innerHeight) < 120);
function syncUI() {
  root.dataset.theme = theme;
  body.classList.toggle('svgldr', svgLoaderOn());
  body.classList.toggle('static', !svgLoaderOn() && (mode === 'static' || !glOK));
  panel.querySelectorAll('[data-theme-btn]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeBtn === theme)));
  panel.querySelectorAll('[data-mode-btn]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.modeBtn === mode)));
  panel.querySelectorAll('[data-speed-btn]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.speedBtn === speed)));
}
function writeURL() {
  try { const u = new URL(location.href); u.searchParams.set('theme', theme); u.searchParams.set('mode', mode); history.replaceState(null, '', u); } catch (e) { /* file:// */ }
}
const api = { ready: false, gate: gateWhy || 'ok', duration: () => ({ intro: 5.6, loop: 16, loader: 1.4 })[mode] ?? 0 };
window.NIVEL = api;

if (!glOK) {
  panel.querySelectorAll('[data-speed-btn]').forEach(b => b.closest('.grp').remove());
  panel.querySelectorAll('[data-mode-btn="intro"],[data-mode-btn="loop"]').forEach(b => b.remove());
  if (mode === 'intro' || mode === 'loop') mode = 'static';
  panel.querySelectorAll('[data-theme-btn]').forEach(b => b.onclick = () => { theme = b.dataset.themeBtn; syncUI(); writeURL(); });
  panel.querySelectorAll('[data-mode-btn]').forEach(b => b.onclick = () => { mode = b.dataset.modeBtn; syncUI(); writeURL(); });
  document.getElementById('b-replay').remove();
  syncUI();
  api.ready = true; window.__nivelReady = true;
} else {
  start().catch(e => { console.error(e); body.classList.remove('gl'); body.classList.add('static'); api.ready = true; window.__nivelReady = true; });
}

async function start() {
const { THREE, SVGLoader, Line2, LineSegments2, LineGeometry, LineSegmentsGeometry, LineMaterial, RoomEnvironment } = NV;

/* --------------------------------------------------------------- timeline */
const DUR = { intro: 5.6, loop: 16, loader: 1.4 };
const D = 8;          // extrusion depth, mark units (module 8 of the 64 grid)
const B = 1.1;        // chamfer 45 deg; bevelOffset = -B keeps the outer silhouette = SVG
const LIFT = 10;      // approach height before seating: 10 units = 10 mm at M 1:1 -> +0.010
const GAP = 10;       // gap between the main view and the plan view on the sheet

const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = u => ((ax * u + bx) * u + cx) * u, sy = u => ((ay * u + by) * u + cy) * u;
  const dx = u => (3 * ax * u + 2 * bx) * u + cx;
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let u = x;
    for (let i = 0; i < 8; i++) { const e = sx(u) - x, d = dx(u); if (Math.abs(e) < 1e-6 || Math.abs(d) < 1e-6) break; u -= e / d; }
    if (u < 0 || u > 1) { let lo = 0, hi = 1; u = x; for (let i = 0; i < 30; i++) { const v = sx(u); if (v < x) lo = u; else hi = u; u = (lo + hi) / 2; } }
    return sy(u);
  };
}
const E = {
  draw: bezier(.45, 0, .2, 1),     // pen: quick start, careful finish
  out: bezier(.2, .7, .2, 1),      // design system --ease-out
  io: bezier(.65, 0, .35, 1),      // design system --ease-io
  cam: bezier(.55, 0, .25, 1),     // camera: dolly with long settle
  land: bezier(.3, 0, .1, 1),      // seating: steady approach, slow last millimetres, no bounce
};

/* ------------------------------------------------------------ brand data */
// Geometry comes only from the approved SVG files (copied verbatim).
const MARK_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><title>Nivel — Отметка уровня с полкой</title><path fill="#1D1D1B" d="M8 16h52v8h-52Z"/><path fill="#D9501A" d="M8 24L24 24L24 40Z"/><path fill="#1D1D1B" d="M24 24L40 24L24 40Z"/><path fill="#1D1D1B" d="M4 40h56v8h-56Z"/></svg>`;
const LOCKUP_SVG = document.querySelector('#fallback .lg-d').outerHTML;

const PAL = {
  day: { bg: '#F1EFEA', main: '#1D1D1B', hatch: '#D9501A', text: '#1D1D1B', dimText: '#5E574D',
    op: { main: .92, edge: .9, dim: .5, hatch: .95, hidden: .55, axis: .4, ground: .7, fold: .55, grid: .06, gridMaj: .11 } },
  night: { bg: '#0E0C0B', main: '#F1EFEA', hatch: '#F06A30', text: '#F1EFEA', dimText: '#A39C90',
    op: { main: .86, edge: .86, dim: .42, hatch: .95, hidden: .5, axis: .32, ground: .62, fold: .5, grid: .045, gridMaj: .085 } },
};
// signal colours are input albedo, calibrated so the lit flat face renders as the brand colour (#D9501A day, #F06A30 night)
const MAT = {
  day: {
    clay: '#A8A196',
    base: { color: '#111110', metalness: 0, roughness: .62, clearcoat: 0, clearcoatRoughness: .5, anisotropy: 0, envI: .32 },
    signal: { color: '#DD4F03', metalness: 0, roughness: .5, clearcoat: .06, clearcoatRoughness: .4, anisotropy: 0, envI: .3, specI: .3 },
  },
  night: {
    clay: '#4A443E',
    base: { color: '#E6E2DA', metalness: .92, roughness: .3, clearcoat: 0, clearcoatRoughness: .5, anisotropy: .45, envI: .9 },
    signal: { color: '#E76423', metalness: 0, roughness: .45, clearcoat: .1, clearcoatRoughness: .3, anisotropy: 0, envI: 1.45, specI: .3 },
  },
};

/* ------------------------------------------------------------------ fonts (local, data URIs) */
const F = window.NV_FONTS;
if (F) {
  const faces = [
    new FontFace('IBM Plex Mono', `url(data:font/woff2;base64,${F.l400})`, { weight: '400', unicodeRange: 'U+0000-00FF,U+2000-206F,U+2212' }),
    new FontFace('IBM Plex Mono', `url(data:font/woff2;base64,${F.c400})`, { weight: '400', unicodeRange: 'U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116' }),
    new FontFace('IBM Plex Mono', `url(data:font/woff2;base64,${F.l500})`, { weight: '500', unicodeRange: 'U+0000-00FF,U+2000-206F,U+2212' }),
  ];
  try { await Promise.all(faces.map(f => f.load().then(ff => document.fonts.add(ff)))); } catch (e) { /* system mono */ }
}

const coarse = matchMedia('(pointer: coarse)').matches;
let DPR = Math.min(window.devicePixelRatio || 1, coarse ? 1.75 : 2);
renderer.setPixelRatio(DPR);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
// linear output: Neutral tone mapping subtracts the darkest channel in shadows and turns warm darks amber
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(20, 1, 1, 1000);
const lineMats = [];

/* ------------------------------------------------------------ procedural textures (seeded = deterministic) */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function canvasTex(w, h, paint, { srgb = false, repeat = [1, 1] } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  paint(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); t.anisotropy = 8;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
// paper: #F1EFEA with faint fibres (+-1.5 %)
const paperTex = canvasTex(512, 512, (x, w, h) => {
  const r = rng(7); x.fillStyle = '#F1EFEA'; x.fillRect(0, 0, w, h);
  const img = x.getImageData(0, 0, w, h), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() - .5) * 5; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  x.putImageData(img, 0, 0);
  for (let i = 0; i < 900; i++) { const px = r() * w, py = r() * h, a = r() * Math.PI, l = 3 + r() * 9;
    x.strokeStyle = r() < .5 ? 'rgba(120,105,85,.05)' : 'rgba(255,255,255,.08)'; x.lineWidth = .6;
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l); x.stroke(); }
}, { srgb: true });
// asphalt micro relief: roughness 0.75..1 multiplier + bump from the same noise
const asphaltTex = canvasTex(256, 256, (x, w, h) => {

function fadeOf(kind, t) {
  if (mode !== 'intro') return 0;
  switch (kind) {
    case 'draft': return 1 - seg(t, 1.65, 1.95);
    case 'plan': return 1 - seg(t, 2.5, 2.8);
    case 'edge': return 1 - seg(t, 2.3, 2.55);
    case 'hatch': return 1 - seg(t, 2.05, 2.3);

}

  const k = [[1.40, 0], [1.425, .75], [1.46, .2], [1.50, .85], [1.53, .6], [1.66, 1]];
  if (t <= k[0][0]) return 0;
  for (let i = 1; i < k.length; i++) if (t < k[i][0]) return lerp(k[i - 1][1], k[i][1], (t - k[i - 1][0]) / (k[i][0] - k[i - 1][0]));
  return 1;
}

function pose(t) {

    gridMaj.material.opacity = PAL[theme].op.gridMaj * seg(T, 0, .3) * f;

    const med = [...frameTimes].sort((a, b) => a - b)[20];
    if (med > 19 && DPR > 1) { DPR = Math.max(1, DPR * .7); renderer.setPixelRatio(DPR); resize(); }
    degraded = true;
  }
}
let firstFrame = true;
function draw() { renderer.render(scene, camera); if (firstFrame) { firstFrame = false; body.classList.add('gl'); } }
function frame(now) {
  raf = 0;
  guard(now);
  tNow = (now - t0) / 1000 * speed;
  pose(tNow); draw();
  if (mode === 'intro' && tNow >= DUR.intro) return; // hold the final frame, stop rendering
  raf = requestAnimationFrame(frame);
}
function play(fromT = 0) {
  if (raf) cancelAnimationFrame(raf), raf = 0;
  syncUI();
  if (mode === 'static' || svgLoaderOn()) return;
  t0 = performance.now() - fromT * 1000 / speed;
  raf = requestAnimationFrame(frame);
}
function renderAt(t) { tNow = t; pose(t); draw(); }

if (Q.get('debug') === '1') api.dbg = { THREE, scene, camera, renderer, lamp, sun, hemi, wall, floor, matBase, matUpper, matDot, SIG, MAT, woodTex, pose, draw, themeMaps };
api.seek = t => { if (raf) cancelAnimationFrame(raf), raf = 0; renderAt(t); return true; };
api.setTheme = th => { theme = th; applyTheme(); syncUI(); writeURL(); if (!raf && mode !== 'static') renderAt(tNow); };
api.setMode = m => { mode = m; applyMode(); syncUI(); writeURL(); if (mode !== 'static' && !svgLoaderOn()) { if (autoplay || showUI) play(0); else renderAt(0); } };

applyTheme(); applyMode(); resize();
window.addEventListener('resize', () => { resize(); syncUI(); if (!raf && mode !== 'static') renderAt(tNow); });

// warm-up: compile every program the intro, loop and loader will need, upload all textures before the first frame
{
  const m0 = mode;
  for (const tx of [paperTex, asphaltTex, brushedTex, brushedCol, woodTex]) renderer.initTexture(tx);
  // real renders while the canvas is still hidden: also compiles the shadow-pass programs that compile() skips
  for (const [m, ts] of [['intro', [.9, 1.5, 1.8, 2.2, 3.0, 4.2, DUR.intro]], ['loop', [2]]]) { mode = m; for (const tw of ts) { pose(tw); renderer.render(scene, camera); } }
  mode = m0; applyMode();
}

syncUI();
if (mode !== 'static' && !svgLoaderOn()) {
  if (tFixed !== null) renderAt(tFixed);
  else if (autoplay) play(0);
  else renderAt(mode === 'intro' ? DUR.intro : 0);
}

// panel
document.getElementById('b-replay').onclick = () => { if (mode === 'static') api.setMode('intro'); else play(0); };
panel.querySelectorAll('[data-theme-btn]').forEach(b => b.onclick = () => api.setTheme(b.dataset.themeBtn));
panel.querySelectorAll('[data-mode-btn]').forEach(b => b.onclick = () => api.setMode(b.dataset.modeBtn));
panel.querySelectorAll('[data-speed-btn]').forEach(b => b.onclick = () => { const cur = tNow; speed = +b.dataset.speedBtn; syncUI(); if (raf) play(cur); });

api.ready = true;
window.__nivelReady = true;
}
</script>
